# nginx.conf

# Worker processes and connections
worker_processes  auto;

events {
    worker_connections  4096; 
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    types {
        application/javascript mjs;
        application/javascript js;
    }

    # Performance optimizations
    sendfile        on; 
    tcp_nopush      on; 
    tcp_nodelay     on; 
    keepalive_timeout 65; 
    client_max_body_size 200M;  
    client_body_buffer_size 128k; 

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;

    # Buffering settings for improved performance
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Upstream backend server
    upstream backend {
        server flowmatic-backend:8080;
        keepalive 32;
    }

    # Server block
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html index.htm;
        server_name ${NGINX_SERVER_NAME};

        add_header X-Served-By $hostname;

        # API proxy configuration
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_read_timeout 86400;
            
            # Disable buffering for WebSocket or long-lived connections
            proxy_buffering off;
        }

        # Serve static files
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Error handling
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
        
        # Deny access to hidden files (e.g., .htaccess)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Deny access to specific file types (e.g., .log, .bak)
        location ~* \.(log|bak)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        location /cdn/ {
            rewrite ^/cdn/(.*)$ /$1 break;

            proxy_pass http://flowmatic-minio:9000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout  120;
            proxy_send_timeout  120;

            proxy_buffering off;
        }
    }
}
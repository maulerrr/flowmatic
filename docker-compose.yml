services:
  # ============================================================================
  # 1) Database (PostgreSQL)
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: flowmatic-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-flowmatic}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-flowmatic}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ============================================================================
  # 2) Backend (NestJS API)
  # ============================================================================
  backend:
    container_name: flowmatic-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      # Database connection string constructed from Postgres envs
      DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/${POSTGRES_DB:-flowmatic}
      
      # App Settings
      SERVER_PORT: 8080
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      
      # CORS settings for the frontend
      # Allow all for demo purposes
      SECURITY_BACKEND_CORS_ORIGINS: "*" 
      
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  # ============================================================================
  # 3) Frontend (Vite + Nginx)
  # ============================================================================
  frontend:
    container_name: flowmatic-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass domain name for Nginx server_name directive
        NGINX_SERVER_NAME: ${DOMAIN_NAME:-localhost}
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
